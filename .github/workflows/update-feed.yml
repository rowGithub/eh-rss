name: Update EH RSS

on:
  workflow_dispatch:

  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate RSS
        run: python main.py

      - name: Save generated feed and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.xml feed-*.xml state.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update filtered RSS feed"
            git push
          fi

      - name: Prepare Pages files
        run: |
          mkdir -p public
          cp feed.xml public/feed.xml
          cp feed-0.xml public/feed-0.xml
          cp feed-1.xml public/feed-1.xml
          cp feed-2.xml public/feed-2.xml
          cp feed-3.xml public/feed-3.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public


  deploy:
    needs: update-feed

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Notify WebSub hub
        run: |
          BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          HUB="https://pubsubhubbub.appspot.com/"

          for i in 0 1 2 3
          do
            echo "Publishing $BASE_URL/feed-$i.xml"

            curl \
              --fail \
              --silent \
              --show-error \
              -X POST \
              "$HUB" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "hub.mode=publish" \
              --data-urlencode "hub.url=$BASE_URL/feed-$i.xml"

            echo "WebSub notification sent for feed-$i.xml"
          done
